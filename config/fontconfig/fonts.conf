<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- Fallback order for generic families:
       1. the font the app actually asked for (unchanged)
       2. Nerd Font symbols (icons)
       3. CJK (Chinese/Japanese/Korean)
       4. Emoji / Font Awesome -->

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
    </prefer>
    <default>
      <family>Symbols Nerd Font</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Color Emoji</family>
      <family>Font Awesome 7 Free</family>
    </default>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
    </prefer>
    <default>
      <family>Noto Serif CJK SC</family>
      <family>Noto Color Emoji</family>
    </default>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
    </prefer>
    <default>
      <family>Symbols Nerd Font</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Color Emoji</family>
    </default>
  </alias>

  <!-- Chinese text should use the SC (Simplified) glyph variants,
       not the JP/KR ones fontconfig picks otherwise -->
  <match target="pattern">
    <test qual="any" name="lang" compare="contains">
      <string>zh</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>

</fontconfig>
